<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuscleAtlas</title>
</head>
<body class="loading">
<header id="brand"><h1>MuscleAtlas</h1></header>
<nav id="rail" aria-label="Muscles" data-state="open">
  <button id="rail-pill" type="button" aria-expanded="false" aria-controls="listcard"><span class="pill-label">Muscles</span><span id="rail-current"></span></button>
  <div id="listcard"><ul id="list"></ul><button id="clear" type="button">Clear</button><p id="hint">Esc or click empty space to deselect</p></div>
</nav>
<main id="stage"><div id="loading" role="status"><div id="loading-text">Loading model...</div><progress id="loading-bar" max="1"></progress></div><div id="error" role="alert"></div><div id="tip" aria-hidden="true"></div></main>
<div id="selected" aria-live="polite"></div>
<aside id="info" aria-labelledby="info-title"></aside>
<footer id="credits">Model: Z-Anatomy - The libre 3D atlas of anatomy - CC-BY-SA 4.0; BodyParts3D - The Database Center for Life Science - CC-BY-SA 2.1 Japan</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
