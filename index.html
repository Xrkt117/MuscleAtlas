<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%276%27%20fill=%27%231b1d21%27/%3E%3Cpath%20d=%27M16%205c6%203%208%209%205%2014-1%203-3%206-5%208-2-2-4-5-5-8-3-5-1-11%205-14z%27%20fill=%27%23c87f6e%27/%3E%3C/svg%3E">
<title>MuscleAtlas</title>
</head>
<body class="loading">
<header id="brand"><h1>MuscleAtlas</h1></header>
<nav id="rail" aria-label="Muscles" data-state="open">
  <button id="rail-pill" type="button" aria-expanded="false" aria-controls="listcard"><span class="pill-label">Muscles</span><span id="rail-current"></span></button>
  <div id="listcard">
    <ul id="list"></ul>
    <button id="clear" type="button">Clear</button>
    <p id="hint">Esc or click empty space to deselect</p>
    <details id="muscle-guide">
      <summary>Muscle building</summary>
      <div id="guide-body"></div>
    </details>
  </div>
</nav>
<main id="stage"><div id="loading" role="status"><div id="loading-text">Loading model...</div><progress id="loading-bar" max="1"></progress></div><div id="tip" aria-hidden="true"></div></main>
<div id="error" role="alert"></div>
<div id="selected" aria-live="polite"></div>
<aside id="info" aria-labelledby="info-title"></aside>
<nav id="view-controls" aria-label="Model view controls">
  <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7v7M7 10.5h7"/></svg>
  </button>
  <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7 10.5h7"/></svg>
  </button>
  <button id="reset-view" type="button" aria-label="Return to centred view" title="Return to centred view">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7M5.5 10v10h13V10M9 20v-6h6v6"/></svg>
  </button>
</nav>
<footer id="sources">
  <details>
    <summary>Sources</summary>
    <div id="sources-body"></div>
  </details>
</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
