<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuscleAtlas</title>
<style>
  html, body { margin: 0; height: 100%; background: #222; color: #eee; font: 14px system-ui, sans-serif; }
  body { display: grid; grid-template: "head head" auto "side stage" 1fr "foot foot" auto / 200px 1fr; }
  header { grid-area: head; padding: 8px 12px; font-weight: 600; border-bottom: 1px solid #444; }
  aside { grid-area: side; padding: 8px; overflow-y: auto; border-right: 1px solid #444; }
  ul { list-style: none; margin: 0 0 8px; padding: 0; }
  li button, #clear { width: 100%; text-align: left; padding: 6px 8px; margin: 0 0 2px; background: #333; color: inherit; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  li button[aria-pressed="true"] { background: #a00; }
  #stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #stage canvas { display: block; }
  #selected { position: absolute; left: 12px; bottom: 12px; pointer-events: none; }
  #tip { display: none; position: absolute; pointer-events: none; padding: 3px 8px; background: #000c; border-radius: 4px; white-space: nowrap; }
  #error { display: none; position: absolute; inset: 0 0 auto 0; padding: 12px; background: #900; color: #fff; z-index: 1; }
  footer { grid-area: foot; padding: 6px 12px; border-top: 1px solid #444; font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<header>MuscleAtlas</header>
<aside><ul id="list"></ul><button id="clear" type="button">Clear</button></aside>
<main id="stage"><div id="error" role="alert"></div><div id="selected"></div><div id="tip"></div></main>
<footer>Model: Z-Anatomy - The libre 3D atlas of anatomy - CC-BY-SA 4.0; BodyParts3D - The Database Center for Life Science - CC-BY-SA 2.1 Japan</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
